name: eCourts Nightly Sync

on:
  # Run every night at 11:30 PM IST (6:00 PM UTC)
  schedule:
    - cron: '0 18 * * *'
  # Also allow manual trigger from GitHub UI
  workflow_dispatch:

jobs:
  sync-ecourts:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        working-directory: ./scripts/ecourts-scraper
        run: npm install

      - name: Install Playwright Browsers
        working-directory: ./scripts/ecourts-scraper
        run: npx playwright install chromium --with-deps

      - name: Run eCourts Crawler
        working-directory: ./scripts/ecourts-scraper
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scraper.js

      - name: Upload Logs on Failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: crawler-failure-logs
          path: scripts/ecourts-scraper/*.png
          if-no-files-found: ignore
