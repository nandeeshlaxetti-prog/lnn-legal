name: Test eCourts Scraper

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/ecourts-scraper/test-crawler.js'
      - 'scripts/ecourts-scraper/package.json'

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        working-directory: ./scripts/ecourts-scraper
        run: npm install

      - name: Install Playwright Browsers
        working-directory: ./scripts/ecourts-scraper
        run: npx playwright install chromium --with-deps

      - name: Run Test Crawler
        working-directory: ./scripts/ecourts-scraper
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node test-crawler.js KABC030534362020

      - name: Upload Screenshots & CAPTCHA Images
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scraper-screenshots
          path: |
            scripts/ecourts-scraper/captcha_*.png
            scripts/ecourts-scraper/result_*.png
          if-no-files-found: ignore
